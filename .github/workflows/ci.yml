name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Clean Test Cache
        run: go clean -testcache

      - name: Run Vendor-Neutrality and Skill Lint Tests
        run: go test ./internal/vendorcheck/... -v

      - name: Run Unit Tests
        run: go test ./cmd/... ./internal/... -v

      - name: Run Test Suite
        run: go test ./test/... -v

      - name: Clean Test Artifacts
        if: always()
        run: git clean -fX -e "!go.sum"