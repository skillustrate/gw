name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Multi-Arch Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ""
          - os: linux
            arch: arm64
            suffix: ""
          - os: darwin
            arch: amd64
            suffix: ""
          - os: darwin
            arch: arm64
            suffix: ""
          - os: windows
            arch: amd64
            suffix: ".exe"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          BIN_NAME="gw-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}"
          go build -trimpath -ldflags "-s -w" -o "dist/${BIN_NAME}" ./cmd/gw
          cd dist && sha256sum "${BIN_NAME}" > "${BIN_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/**/*
          generate_release_notes: true